[package]
name = "schminput"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "An Action Based Input Manager for Bevy"
keywords = ["bevy", "input", "vr", "xr", "action"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/Schmarni-Dev/Schminput/"

[workspace.dependencies]
schminput = { path = ".", version = "0.5.0" }
bevy = { version = "0.20", default-features = false, features = [
    "mouse",
    "keyboard",
    "gamepad",
] }
bevy_mod_openxr = { git = "https://github.com/awtterpip/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d" }
bevy_mod_xr = { git = "https://github.com/awtterpip/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d" }
openxr = "0.22"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[example]]
name = "xr"
required-features = ["xr"]
[[example]]
name = "xr_actionset_priorities"
required-features = ["xr"]

[features]
default = []
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[dependencies]
atomicow = "1.0.0"
bevy = { workspace = true, features = ["bevy_log"] }
bevy_mod_xr = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
openxr = { workspace = true, optional = true }
bevy_mod_openxr = { workspace = true, optional = true }

[workspace]
members = ["schminput_rebinding"]

[dev-dependencies]
bevy_mod_openxr = { workspace = true, default-features = true }
bevy = { workspace = true, default-features = true }
